buildscript {
    repositories {
        //TODO! Del this!
        mavenLocal()

        mavenCentral()
    }

    dependencies {
        classpath 'info.gianlucacosta.aurora:aurora:10.0.0-SNAPSHOT'

        classpath 'com.github.maiflai:gradle-scalatest:0.14'
    }
}


apply plugin: 'scala'
apply plugin: 'maven'
apply plugin: 'osgi'
apply plugin: 'com.github.maiflai.scalatest'

apply plugin: 'info.gianlucacosta.aurora'


group 'info.gianlucacosta.twobinpack'
archivesBaseName = 'twobinkernel'
version = '4.0.0-SNAPSHOT'


description = 'Scala library for two-dimensional packing'


dependencies {
    compile 'org.scala-lang:scala-library:2.11.8'

    compile 'com.thoughtworks.xstream:xstream:1.4.9'

    compile 'info.gianlucacosta.helios:helios-fx:7.0.0-SNAPSHOT'

    testCompile 'org.scalatest:scalatest_2.11:2.2.6'
    testRuntime 'org.pegdown:pegdown:1.6.0'
}


aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }
}